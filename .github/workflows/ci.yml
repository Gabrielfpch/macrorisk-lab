name: Model checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project metadata
        run: npm ci

      - name: Run financial-model tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check
